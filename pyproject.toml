[tool.poetry]
name = "bank-project"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"  # file is empty
packages = [{include = "bank_project", from = "src"}]


[tool.poetry.dependencies]
python = "^3.13"


[tool.poetry.group.lint.dependencies]
black = "^25.1.0"
isort = "^6.0.1"
flake8 = "^7.3.0"
mypy = "^1.18.1"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
namespace_packages = true
exclude = "venv"
mypy_path = "src"
files = "*.py"


[tool.black]
line-length = 119
include = '\.pyi?$'
exclude = """
/(
\\.git
  | \\.hg
  | \\.mypy_cache
  | \\.tox
  | \\.venv
  | _build
  | buck-out
  | build
  | dist
  |\\.gitignore
  |\\.idea
)/
"""


[tool.isort]
line_length = 119
exclude = """
/(
\\.git
  | \\.hg
  | \\.mypy_cache
  | \\.tox
  | \\.venv
  | _build
  | buck-out
  | build
  | dist
  |\\.gitignore
  |\\.idea
)/
"""
